name: CD - Deploy to ECS

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}-repo
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}-cluster
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}-service
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}-container

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "uri=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          soft_fail: true

      - name: Terraform validate
        uses: dflook/terraform-validate@v2
        id: validate
        with:
          path: terraform

      - name: Terraform fmt check
        uses: dflook/terraform-fmt@v2
        with:
          path: terraform

      - name: Terraform plan
        uses: dflook/terraform-plan@v2
        with:
          path: terraform

      - name: Terraform apply
        id: terraform-apply
        uses: dflook/terraform-apply@v2
        continue-on-error: true
        with:
          path: terraform
          auto_approve: true

  health-check:
    name: Post-Deploy Health Check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://${{ vars.DOMAIN_NAME }}/health
          follow-redirect: true
          max-attempts: 20
          retry-delay: 15s

      - name: Deployment summary
        run: |
            echo "## Deployment Status" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Website successfully running: https://${{ vars.DOMAIN_NAME }}" >> "$GITHUB_STEP_SUMMARY"          