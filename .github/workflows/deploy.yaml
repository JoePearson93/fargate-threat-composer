name: CD - Deploy to ECS

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}-repo
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}-cluster
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}-service
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME}}-container

jobs:
  auth:
    name: Authenticate to AWS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image: ${{ steps.image.outputs.uri }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

  build:
    name: Build push & deploy to ECS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          soft_fail: true

      - name: Build image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "uri=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
      - name: terraform validate
        uses: dflook/terraform-validate@v2
        id: validate
        with:
          path: terraform

      - name: terraform fmt
        uses: dflook/terraform-fmt@v2
        with:
          path: terraform

      - name: terraform plan
        uses: dflook/terraform-plan@v2
        with:
          path: terraform   

      - name: terraform apply
        id: first-try
        uses: dflook/terraform-apply@v2
        continue-on-error: true
        with:
          path: terraform
          auto_approve: true


 